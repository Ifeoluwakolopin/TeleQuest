name: Python Unittests with Coverage

on: [pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11.x'
      
    - name: Set Environment Variables
      run: |
        echo "DB_NAME=telequest" >> $GITHUB_ENV
        echo "BOT_TOKEN=bot_token_key" >> $GITHUB_ENV
        echo "LOCAL_BOT_TOKEN=local_bot_token_key" >> $GITHUB_ENV
        echo "MONGO_URI=mongo_db_key" >> $GITHUB_ENV
        echo "PINECONE_KEY=your_pinecone_key" >> $GITHUB_ENV
        echo "PINECONE_ENV=your_pinecone_env" >> $GITHUB_ENV
        echo "OPENAI_API_KEY=your_openai_key" >> $GITHUB_ENV
        echo "ENVIRONMENT=TEST" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install coverage
        pip install -r mypy-requirements.txt

    - name: Run unittests with coverage
      run: |
        python - <<'PY'
        import socket
        import unittest
        import requests
        from unittest.mock import patch
        from coverage import Coverage
        coverage = Coverage()
        coverage.start()
        with patch("dotenv.load_dotenv"), patch("pymongo.MongoClient"), \
             patch("requests.sessions.Session.request",
                   side_effect=requests.exceptions.ConnectionError("isolated test transport")), \
             patch.object(socket.socket, "connect", side_effect=AssertionError("network disabled")):
            suite = unittest.defaultTestLoader.discover(".")
            result = unittest.TextTestRunner(verbosity=2).run(suite)
        coverage.stop()
        coverage.save()
        raise SystemExit(not result.wasSuccessful())
        PY
        coverage report -m
